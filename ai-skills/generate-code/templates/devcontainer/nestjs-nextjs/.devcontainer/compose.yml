# 開発コンテナ (dev) と Harmony (harmony) を同居させる構成。
#
# - dev     : AI CLI・ビルド・テストを動かす。プロジェクトのフォルダを /workspaces/app に置く
# - harmony : 設計ツール (Harmony の配布 image)。dev とネットワークを共有するので、dev からは
#             http://localhost:5179/mcp で届く。ports は書かない (画面は VS Code のポート転送 5179 で開く)
#
# 2 つのコンテナが「同じパス /workspaces/app」で同じフォルダを見る。これにより、設計 (design/) と
# 生成したソース (プロジェクトのルート直下、または出力先に指定したフォルダ) が Harmony のワークスペースの中に入り、生成の記録 (designer__record_generation) が
# そのまま使える。フォルダ名を /workspaces/app から変えない (compose は VS Code のフォルダ名を読めないため固定)。
services:
  dev:
    image: mcr.microsoft.com/devcontainers/typescript-node:26
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspaces/app:cached

  harmony:
    # Harmony の版は、この行の既定値 (:local の部分) を公開済みの版 (例: ghcr.io/csilost2001/harmony:1.0) に書き換えて固定する。
    # このファイルは git で共有されるので、チームで同じ版になる。一時的に変えるだけなら、ホストの環境変数 HARMONY_IMAGE を使う。
    image: ${HARMONY_IMAGE:-ghcr.io/csilost2001/harmony:local}
    network_mode: service:dev
    environment:
      NODE_ENV: production
      # 画面でフォルダを選ぶときの、最初に見せる場所 (ワークスペースを自動で開く設定ではない)
      HARMONY_WORKSPACES_DIR: /workspaces/app
      # 画面で選べるフォルダの範囲
      HARMONY_ALLOWED_BROWSE_ROOTS: /workspaces
      # ワークスペースは最初の 1 回だけ、画面 (ワークスペースの選択) か MCP の designer__workspace_open で /workspaces/app を開く。
      # 開いたワークスペースは下の harmony-state に記録され、次からは起動時に自動で開く。
    volumes:
      - ..:/workspaces/app
      - harmony-state:/home/node/.harmony

volumes:
  harmony-state:
